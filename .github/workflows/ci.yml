name: Validate SecurePR
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-02
        with:
          persist-credentials: false
      - name: Python helper and scorer tests
        run: python3 -I -m unittest discover -s tests/unit -v
      - name: Project integrity
        run: python3 -I tools/check_project.py
      - name: Replay recorded evaluation
        run: python3 -I tools/evaluate.py evaluation/runs/blind-r1.json --strict
      - name: Validate example evidence
        run: python3 -I scripts/securepr.py validate-report . examples/review.json
      - name: Trusted synthetic fix regression
        run: node examples/fix-mode/regression.test.mjs
      - name: Trusted synthetic audit fix regressions
        run: |
          node examples/audit-fix-mode/mass-assignment/regression.test.mjs
          node examples/audit-fix-mode/checkout-price/regression.test.mjs
      - name: Reconcile frozen audit population
        run: python3 -I tools/release_population.py --check
      - name: Trusted release demo regression
        run: node examples/release-demo/regression.test.mjs
  publish_v1:
    name: Publish requested v1.0.0 release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Noorkhalel/SecurePR-AI-Security-Code-Review-Skill'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: securepr-v1-publication
      cancel-in-progress: false
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish v1.0.0 once without moving tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Noorkhalel/SecurePR-AI-Security-Code-Review-Skill
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat VERSION)" != '1.0.0' ]; then
            echo 'This job only publishes the requested first public version.'
            exit 0
          fi
          published=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.tag_name == "v1.0.0" and .draft == false)] | length')
          if [ "$published" -gt 0 ]; then
            echo 'v1.0.0 is already published; no tag or release is modified.'
            exit 0
          fi
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" != "$RELEASE_SHA" ]; then
            echo 'A newer main revision exists; do not publish this stale run.'
            exit 1
          fi
          tag_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v1.0.0" --jq '[.[] | select(.ref == "refs/tags/v1.0.0")] | length')
          if [ "$tag_count" -eq 0 ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.0.0' -f sha="$RELEASE_SHA"
          else
            tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.0" --jq '.object.sha')
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo 'Existing tag differs from this validated revision; refusing to move it.'
              exit 1
            fi
          fi
          gh release create v1.0.0 --verify-tag --title 'SecurePR v1.0.0' --notes-file release-assets/github-release-v1.0.0.md
